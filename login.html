<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Iceland&display=swap" rel="stylesheet">


<style>

.iceland-regular {
  font-family: "Iceland", sans-serif;
  font-weight: 400;
  font-style: normal;
}
</style>

<script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              iceland: ['"Iceland"', 'sans-serif'],
            },
          }
        }
      }
    </script>


</head>
<body>
    <section class="min-h-max w-full flex items-center justify-center bg-black">
<div class="bg-gray-950 container shadow-md rounded-lg flex justify-center items-center flex-col">
    <h1 class="text-white text-left text-2xl pt-6 font-sans">SELAMAT DATANG!</h1>
    <h3 class="text-gray-500 text-left text-md font-sans opacity-80">SIlahkan masuk ke akun Identra Studio anda.</h3>

    <form class="pt-10"> 
        <label class="pt-3 font-iceland text-white" for="Email">Email Address</label><br>
        <input type="email" id="Email" name="Email" placeholder="Input Your Email Here..." class="border border-gray-300"><br>
        <label class="pt-3 font-iceland text-white" for="pwd"> Password</label><br>
        <input type="password" id="pwd" name="pwd" placeholder="Input Your Password..." class="border border-gray-300"><br>

        <input type="checkbox" id="remember" name="remember">
        <label class="pt-3 font-iceland text-white" for="remember"> Ingat saya</label><br>
        <button type="submit" class="pt-3 border border-gray-200 bg-white py-2 px-6 font-bold transition hover:shadow-xl transform hover:scale-105 duration-300">Masuk Sekarang</button>
    </form>
    <div class="flex flex-row p-6 gap-5">
        <h3 class="font-sans text-gray-500 text-md">Belum bergabung dengan kami?</h3>
        <a class="font-iceland text-white font-bold text-xl" href="register.html">DAFTAR AKUN</a>
    </div>
    




</div>
    
</section>

</body>
</html>
